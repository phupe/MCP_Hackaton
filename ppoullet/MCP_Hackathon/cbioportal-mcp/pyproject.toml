[project]
name = "cbioportal-mcp"
version = "0.1.0"
description = "MCP server exposing the cBioPortal cancer genomics REST API as tools"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.9,<2",
    "httpx>=0.27",
]

[project.scripts]
cbioportal-mcp = "cbioportal_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cbioportal_mcp"]
